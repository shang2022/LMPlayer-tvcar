name: 自动编译柠檬音乐APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置JDK11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 给gradlew加执行权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: lemon-music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
